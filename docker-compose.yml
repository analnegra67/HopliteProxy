services:
  proxy:
    build: .
    image: hoplite-openai-proxy:0.1.0
    env_file: .env
    environment:
      # Inside the container these must not come from a host-oriented .env
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_PATH: /data/proxy.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - proxy-data:/data
    restart: unless-stopped

volumes:
  proxy-data:
